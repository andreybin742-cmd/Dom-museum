<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Домашний музей</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{color-scheme:dark;--glass:rgba(24,22,28,.75);--line:rgba(255,255,255,.18);--tx:#f4efe6;--ac:#e8c27a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:10;padding:16px}
#start .glass{max-width:460px;padding:28px;text-align:center}
h1{margin:0 0 8px;font-weight:600;font-size:28px;letter-spacing:.5px}
p{margin:6px 0;line-height:1.5;font-size:14px;opacity:.9}
button,.btn{font:inherit;color:#1b1710;background:var(--ac);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600;display:inline-block;transition:transform .1s,opacity .2s}
button:active{transform:scale(.96)}
.btn.alt,button.alt{background:rgba(255,255,255,.14);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:#d9534f;color:#fff}

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#hud .glass{padding:6px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
#menuBtn{cursor:pointer;font-weight:bold;padding:6px 10px;background:rgba(255,255,255,.1);border-radius:8px}
#timeBtn{cursor:pointer;font-weight:bold;padding:6px 10px;background:rgba(255,255,255,.1);border-radius:8px}

input{font:inherit;color:var(--tx);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px;width:210px;text-align:center}

#actionsArea{position:fixed;right:16px;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:5;align-items:flex-end;pointer-events:none}
#actionsArea button{pointer-events:auto;margin:0;font-size:15px;padding:14px 20px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.4);font-weight:bold;display:none;border:2px solid rgba(255,255,255,.2)}
#actSit{background:#e8c27a;color:#111}
#actView{background:var(--ac);color:#111}
#actDelete{background:#d9534f;color:#fff}
#actHand{background:#4caf50;color:#fff}
#actChat{background:#2f5d8a;color:#fff}

#stick{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;display:none;z-index:4;touch-action:none;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1)}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--ac);opacity:.9;box-shadow:0 2px 10px rgba(0,0,0,.5)}

#hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 20px;display:none;z-index:3;text-align:center;font-weight:600;white-space:nowrap;background:rgba(0,0,0,.7);border-radius:20px}
#hint b{color:var(--ac)}

#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:8;padding:16px}
#lb img{max-width:94vw;max-height:80vh;border:10px solid #f3efe6;box-shadow:0 20px 60px #000;border-radius:4px}
#lbCloseBtn{background:#fff;color:#000;padding:12px 30px;font-size:16px;border-radius:30px;margin-top:20px}

#gal{position:fixed;inset:0;background:rgba(10,10,12,.95);display:none;flex-direction:column;z-index:9;padding:20px;overflow-y:auto}
#gal h2{text-align:center;margin:0 0 20px 0;color:var(--ac)}
#galGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding-bottom:40px}
.gal-item{position:relative;border-radius:8px;overflow:hidden;border:2px solid #333;cursor:pointer;aspect-ratio:1;background:#222}
.gal-item img{width:100%;height:100%;object-fit:cover}
.gal-del{position:absolute;top:5px;right:5px;background:rgba(217,83,79,.9);color:white;border:0;border-radius:4px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:bold}
#galClose{position:fixed;top:20px;right:20px;z-index:10;border-radius:50%;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px}

#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:11;padding:20px}
#modalOverlay .glass{padding:20px;width:100%;max-width:400px;text-align:center}
#modalOverlay h2{margin-top:0}
#modalOverlay input{width:100%;margin-bottom:12px;box-sizing:border-box}
#modalOverlay button{padding:10px 20px;margin:0 4px}

#load{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:6;padding:8px 16px;display:none;font-size:14px;font-weight:600;background:rgba(0,0,0,.8);border-radius:20px}

.popup-text{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);background:rgba(232,194,122,.95);color:#111;padding:12px 24px;border-radius:30px;font-weight:bold;font-size:16px;z-index:7;pointer-events:none;animation:popup 2s forwards}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%)}10%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
</style></head><body>

<div id="hud">
  <div class="glass">
    <span id="menuBtn">☰ Меню</span>
    <span id="timeBtn">☀️ День</span>
    <span id="who">🏛 Музей</span>
  </div>
  <div class="glass">
    <button class="alt" id="galBtn" style="padding:6px 12px;margin:0;font-size:13px">🖼 Галерея</button>
  </div>
</div>

<div id="start"><div class="glass"><h1>Домашний музей</h1>
<p>Ваши фото в виде картин в просторной галерее. Гуляйте по залу, подходите к рамам и рассматривайте снимки.</p>
<div id="gate">
  <p>🔒 Вход для своих</p>
  <input id="nm" placeholder="Ваше имя" maxlength="16" autocomplete="off"><br>
  <input id="pw" type="password" inputmode="numeric" placeholder="Пароль" autocomplete="off">

</div>
<button id="go" style="width:100%;padding:16px;font-size:18px">Войти в музей</button></div></div>

<div id="actionsArea">
  <button id="actHand">🤝 Пожать руку</button>
  <button id="actDelete">🗑 Удалить картину</button>
  <button id="actView">👁 Посмотреть</button>
  <button id="actAdd">📷 Повесить фото</button>
  <button id="actSit">🪑 Присесть</button>
  <button id="actChat" style="display:block">💬 Написать</button>
</div>

<div id="hint" class="glass"><span id="hintTx"></span></div>

<div id="lb">
  <img id="lbImg" alt="">

</div>

<div id="gal">
  <button class="btn danger" id="galClose">✕</button>

<div id="modalOverlay">
  <div class="glass">
    <h2>Информация о картине</h2>
    <input id="artTitle" placeholder="Название картины" maxlength="20" autocomplete="off">
    <input id="artAuthor" placeholder="Ваше имя (автор)" maxlength="15" autocomplete="off">
    <div style="display:flex;justify-content:center;gap:10px;margin-top:16px">
      <button id="artSave" class="btn">Сохранить</button>
      <button id="artCancel" class="alt">Отмена</button>

<div id="chatModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:11;padding:20px">
  <div class="glass" style="padding:20px;width:100%;max-width:400px;text-align:center">
    <h2>Сообщение</h2>
    <input id="chatInput" placeholder="Введите текст..." maxlength="40" autocomplete="off" style="width:100%;margin-bottom:16px;padding:12px;font-size:16px;box-sizing:border-box">
    <div>
      <button id="chatSend" class="btn">Отправить</button>
      <button id="chatCancel" class="alt">Отмена</button>
    </div>
  </div>
</div>

<div id="stick" class="glass"><div id="knob"></div></div>
<div id="load" class="glass">Загружаю…</div>

<input id="file" type="file" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
const W=26,D=14,H=4.6;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x15130f);scene.fog=new THREE.Fog(0x15130f,18,42);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,80);
const aniso=renderer.capabilities.getMaxAnisotropy();
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tex(c,rx,ry){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.anisotropy=aniso;t.encoding=THREE.sRGBEncoding;return t}

/* Окружение */
const fc=cvs(1024,1024),fx=fc.getContext('2d');
for(let r=0;r<8;r++)for(let i=-1;i<5;i++){const off=(r%2)*128,x=i*256+off,y=r*128,l=40+Math.random()*14;
fx.fillStyle=`hsl(${24+Math.random()*6},${48+Math.random()*10}%,${l}%)`;fx.fillRect(x,y,254,126);
for(let k=0;k<22;k++){fx.strokeStyle=`rgba(50,25,10,${Math.random()*.12})`;fx.beginPath();const yy=y+Math.random()*126;fx.moveTo(x,yy);fx.lineTo(x+254,yy+Math.random()*4-2);fx.stroke()}}
const floorMat=new THREE.MeshStandardMaterial({map:tex(fc,W/4,D/4),roughness:.32,metalness:.05});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

const wc=cvs(512,512),wx=wc.getContext('2d');wx.fillStyle='#e8e2d6';wx.fillRect(0,0,512,512);
for(let i=0;i<9000;i++){wx.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'120,100,80'},${Math.random()*.05})`;wx.fillRect(Math.random()*512,Math.random()*512,2,2)}
const wallMat=new THREE.MeshStandardMaterial({map:tex(wc,6,2),roughness:.92});
function wall(w,h,x,y,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wallMat);m.position.set(x,y,z);m.rotation.y=ry;m.receiveShadow=true;scene.add(m)}
wall(W,H,0,H/2,-D/2,0);wall(W,H,0,H/2,D/2,Math.PI);wall(D,H,-W/2,H/2,0,Math.PI/2);wall(D,H,W/2,H/2,0,-Math.PI/2);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0xf2efe8,roughness:.95}));ceil.rotation.x=Math.PI/2;ceil.position.y=H;scene.add(ceil);

const trimMat=new THREE.MeshStandardMaterial({color:0xf5f2ea,roughness:.6});
[[W,0,-D/2,0],[W,0,D/2,0],[D,-W/2,0,1],[D,W/2,0,1]].forEach(([l,x,z,r])=>{
 [[.12,.08],[H-.08,.12]].forEach(([y,h])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(r?.06:l,h,r?l:.06),trimMat);m.position.set(x+(r?(x<0?.03:-.03):0),y,z+(r?0:(z<0?.03:-.03)));scene.add(m)})});

/* Освещение */
const hemiLight = new THREE.HemisphereLight(0xfff4e6,0x5a4630,.55);
scene.add(hemiLight);
const sun=new THREE.DirectionalLight(0xfff0dd,.55);sun.position.set(6,4.4,4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-15,right:15,top:8,bottom:-8,near:1,far:20});sun.shadow.bias=-.0005;sun.shadow.camera.updateProjectionMatrix();scene.add(sun);scene.add(sun.target);

// Потолочные лампы (управляются кнопкой День/Ночь)
const lampMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:0.1});
for(let i=0;i<4;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(2.4,.04,.3),lampMat);m.position.set(-9.75+i*6.5,H-.02,0);scene.add(m)}
const spots = [];
[[-8.67,-1],[0,-1],[8.67,-1],[-8.67,1],[0,1],[8.67,1]].forEach(([x,s])=>{const l=new THREE.SpotLight(0xffe8c8,0.1,14,1,.8,1.2);l.position.set(x,H-.2,s*(D/2-2));l.target.position.set(x,1.7,s*D/2);scene.add(l,l.target);spots.push(l)});
[-1,1].forEach(s=>{const l=new THREE.SpotLight(0xffe8c8,0.1,14,1,.8,1.2);l.position.set(s*(W/2-2),H-.2,0);l.target.position.set(s*W/2,1.7,0);scene.add(l,l.target);spots.push(l)});

let isNight = false;
function setTime(night) {
  isNight = night;
  document.getElementById('timeBtn').textContent = night ? '🌙 Ночь' : '☀️ День';
  if (window.FB && window.FB.db) window.FB.set(window.FB.ref(window.FB.db, 'time'), { night });
  
  if (night) {
    scene.background.setHex(0x0a0a0c); scene.fog.color.setHex(0x0a0a0c);
    hemiLight.intensity = 0.05; hemiLight.color.setHex(0x445566);
    sun.intensity = 0.05; sun.color.setHex(0x8899ff);
    lampMat.emissiveIntensity = 1.5;
    spots.forEach(s => s.intensity = 1.5);
  } else {
    scene.background.setHex(0x15130f); scene.fog.color.setHex(0x15130f);
    hemiLight.intensity = 0.55; hemiLight.color.setHex(0xfff4e6);
    sun.intensity = 0.55; sun.color.setHex(0xfff0dd);
    lampMat.emissiveIntensity = 0.1;
    spots.forEach(s => s.intensity = 0.1);
  }
}
document.getElementById('timeBtn').onclick = () => setTime(!isNight);

/* Скамьи */
const woodMat=new THREE.MeshStandardMaterial({color:0x4a2f1c,roughness:.5}),cushMat=new THREE.MeshStandardMaterial({color:0x2c3a4a,roughness:.85});
const benches=[[-5,0],[5,0]];
benches.forEach(([x,z])=>{const g=new THREE.Group();
 const s=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,.7),cushMat);s.position.y=.5;g.add(s);
 [[-1.05,-.28],[1.05,-.28],[-1.05,.28],[1.05,.28]].forEach(([a,b])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.08,.46,.08),woodMat);l.position.set(a,.23,b);g.add(l)});
 g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});g.position.set(x,0,z);scene.add(g)});

const rc=cvs(256,256),rx=rc.getContext('2d');rx.fillStyle='#6b2b2b';rx.fillRect(0,0,256,256);rx.strokeStyle='#d9b26a';rx.lineWidth=6;rx.strokeRect(12,12,232,232);rx.lineWidth=2;rx.strokeRect(26,26,204,204);
const rug=new THREE.Mesh(new THREE.PlaneGeometry(14,3.4),new THREE.MeshStandardMaterial({map:tex(rc),roughness:1}));rug.rotation.x=-Math.PI/2;rug.position.y=.005;rug.receiveShadow=true;scene.add(rug);

/* Слоты картин */
const slots=[];const N=6;
for(let i=0;i<N;i++){
  const x=-W/2+(i+.5)*W/N;
  if(i!==2) slots.push({id:'n'+i,p:[x,-D/2],n:[0,1],r:0}); // Пропускаем центральный слот
  slots.push({id:'s'+i,p:[x,D/2],n:[0,-1],r:Math.PI});
}
[-3.2,3.2].forEach((z,idx)=>{slots.push({id:'w'+idx,p:[-W/2,z],n:[1,0],r:Math.PI/2});slots.push({id:'e'+idx,p:[W/2,z],n:[-1,0],r:-Math.PI/2})});

const framesGroup=new THREE.Group();scene.add(framesGroup);let frames=[];
const frameMat=new THREE.MeshStandardMaterial({color:0x3a2616,roughness:.45,metalness:.1}),matMat=new THREE.MeshStandardMaterial({color:0xf3efe6,roughness:.9});
const emptyPlaque = new THREE.MeshStandardMaterial({color:0x555,roughness:.8});

function createFrameBase(slot){
  const g = new THREE.Group();
  g.userData = { slotId: slot.id };
  g.position.set(slot.p[0]+slot.n[0]*.03,1.75,slot.p[1]+slot.n[1]*.03);
  g.rotation.y = slot.r;
  framesGroup.add(g);
  return g;
}

function addArtToFrame(g, img, title, author, id, slotId){
  while(g.children.length) g.remove(g.children[0]);
  g.userData.art = { src:img.src, title, author, id, slotId };
  const a=img.width/img.height;let w=3,h=3/a;if(h>2.2){h=2.2;w=2.2*a}
  const mat=new THREE.Mesh(new THREE.BoxGeometry(w+.5,h+.5,.04),matMat);mat.position.z=.02;g.add(mat);
  const t=new THREE.Texture(img);t.encoding=THREE.sRGBEncoding;t.anisotropy=aniso;t.needsUpdate=true;
  const ph=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,roughness:.5,emissive:0xffffff,emissiveMap:t,emissiveIntensity:isNight?0.8:0.3}));ph.position.z=.045;g.add(ph);
  const T=.12,B=[[w+.5+2*T,T,0,(h+.5+T)/2],[w+.5+2*T,T,0,-(h+.5+T)/2],[T,h+.5,(w+.5+T)/2,0],[T,h+.5,-(w+.5+T)/2,0]];
  B.forEach(([bw,bh,bx,by])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,.09),frameMat);m.position.set(bx,by,.045);m.castShadow=true;g.add(m)});
  
  // Красивая табличка
  const pc=cvs(512,128),px=pc.getContext('2d');
  px.fillStyle='#111'; px.fillRect(0,0,512,128);
  px.fillStyle='#c9a85c'; px.fillRect(4,4,504,120);
  px.fillStyle='#1a1a1a'; px.font='bold 32px Georgia,serif'; px.textAlign='center'; px.textBaseline='middle';
  px.fillText((title||'Без названия').slice(0,24),256,45);
  px.font='italic 24px Georgia,serif';
  px.fillText((author||'Неизвестный автор').slice(0,30),256,85);
  
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.3),new THREE.MeshStandardMaterial({map:tex(pc),metalness:.4,roughness:.4}));
  pl.position.set(0,-(h+.5)/2-.35,.03);g.add(pl);
}
function addEmptyFrameVisual(g){
  while(g.children.length) g.remove(g.children[0]);
  g.userData.art = null;
  const mat=new THREE.Mesh(new THREE.BoxGeometry(2.5,2.5,.04),emptyPlaque);mat.position.z=.02;g.add(mat);
  const b=new THREE.Mesh(new THREE.BoxGeometry(2.7,2.7,.1),frameMat);b.position.z=.04;g.add(b);
  const plus = new THREE.Mesh(new THREE.PlaneGeometry(.5,.5), new THREE.MeshBasicMaterial({color:0xe8c27a, transparent:true, opacity:.5}));
  plus.position.z=.1; g.add(plus);
  const p1 = new THREE.Mesh(new THREE.PlaneGeometry(.5,.1), new THREE.MeshBasicMaterial({color:0xffffff}));
  const p2 = new THREE.Mesh(new THREE.PlaneGeometry(.1,.5), new THREE.MeshBasicMaterial({color:0xffffff}));
  p1.position.z=.11; p2.position.z=.11; g.add(p1); g.add(p2);
}

const frameMap = new Map();
slots.forEach(s => {
  const g = createFrameBase(s);
  addEmptyFrameVisual(g);
  frameMap.set(s.id, g);
  frames.push({ pos: new THREE.Vector3(g.position.x, 1.75, g.position.z), n: new THREE.Vector3(s.n[0], 0, s.n[1]), group: g, id: s.id });
});

/* Телевизор и Камера */
const tvGroup = new THREE.Group();
tvGroup.position.set(0, 1.1, 0); // По центру между лавочками

function shrink(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onerror=()=>res(null);
    fr.onload=()=>{
      const i=new Image();
      i.onload=()=>{
        try{
          let out;
          for(const [m,q] of [[1100,.72],[900,.6],[720,.5],[560,.45],[400,.4]]){
            const s=Math.min(1,m/Math.max(i.width,i.height)),c=cvs(i.width*s|0,i.height*s|0);
            c.getContext('2d').drawImage(i,0,0,c.width,c.height);
            out=c.toDataURL('image/jpeg',q);
            if(out.length<230000) break;
          }
          res(out);
        }catch(e){res(null)}
      };
      i.onerror=()=>res(null); i.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function label(name) {
  const c = cvs(512,128), x = c.getContext('2d');
  x.fillStyle = 'rgba(20,18,24,.7)'; x.beginPath(); x.roundRect(8,20,496,88,44); x.fill();

function makeAvatar(l) {
  const g = new THREE.Group();
  const M = c => new THREE.MeshStandardMaterial({ color:c, roughness:.75 });
  const sk = M(l.skin), sh = M(l.shirt), pa = M(l.pants), hr = M(l.hair), so = M(0x151515);
  const add = (geo,m,x,y,z,p) => { const o=new THREE.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=true; (p||g).add(o); return o; };
  add(new THREE.CylinderGeometry(.21,.18,.7,20), sh, 0,1.2,0);
  add(new THREE.SphereGeometry(.21,20,12), sh, 0,1.55,0).scale.y = .45;
  add(new THREE.SphereGeometry(.14,20,16), sk, 0,1.68,0);
  add(new THREE.SphereGeometry(.15,20,16,0,Math.PI*2,0,Math.PI/1.7), hr, 0,1.7,-.02);
  const limb = (x,y,len,r,m,foot) => {
    const p = new THREE.Group(); p.position.set(x,y,0); g.add(p);
    add(new THREE.CylinderGeometry(r,r*.9,len,10), m, 0,-len/2,0,p);
    if (foot) add(new THREE.BoxGeometry(.13,.07,.24), so, 0,-len-.02,.05,p);
    else add(new THREE.SphereGeometry(r*.95,10,8), sk, 0,-len,0,p);
    return p;
  };
  return { g, armL: limb(-.27,1.42,.55,.055,sh), armR: limb(.27,1.42,.55,.055,sh), legL: limb(-.1,.85,.85,.075,pa,1), legR: limb(.1,.85,.85,.075,pa,1) };
}

function makeMessageSprite(text) {
  const c = cvs(512, 128), x = c.getContext('2d');
  x.fillStyle = 'rgba(255,255,255,0.95)';
  x.beginPath(); x.roundRect(10,10,492,108,20); x.fill();
  x.beginPath(); x.moveTo(256,118); x.lineTo(240,90); x.lineTo(272,90); x.fill();
  x.fillStyle = '#111'; x.font = 'bold 40px system-ui,sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text.slice(0, 30), 256, 60);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthTest: false }));
  s.scale.set(2.5, 0.625, 1); s.position.y = 2.6; s.renderOrder = 11;

}

function upsertRemote(id, pr) {
  let r = remotes.get(id);
  if (!r) {
    const a = makeAvatar(lookOf(pr.k|0)); a.g.add(label(pr.n||'Гость')); a.g.position.set(pr.x,0,pr.z);
    scene.add(a.g);
    r = { a, n: pr.n, face: pr.f||0, speed:0, t:0, dt:0, tx:pr.x, tz:pr.z, tf:pr.f||0, s:pr.s||0, shakeUntil:0, msgSprite:null };
    remotes.set(id, r);
  }
  r.tx = pr.x; r.tz = pr.z; r.tf = pr.f||0; r.s = pr.s||0;
  if (pr.shake) r.shakeUntil = pr.shake;
  
  if (pr.msg && pr.msgT > Date.now() - 7000) {
    if (!r.msgSprite || r.msgSprite.userData.text !== pr.msg) {
      if (r.msgSprite) r.a.g.remove(r.msgSprite);
      r.msgSprite = makeMessageSprite(pr.msg);
      r.msgSprite.userData.text = pr.msg;
      r.a.g.add(r.msgSprite);
    }
  } else if (r.msgSprite) {
    r.a.g.remove(r.msgSprite);
    r.msgSprite = null;
  }
}

let lastSent = 0, lastKey = '';
async function connect() {
  const { db, ref, set, onValue, onDisconnect } = window.FB;
  const myRef = ref(db, 'users/' + myId);
  onDisconnect(myRef).remove(); 

  onValue(ref(db, 'users'), (snap) => {
    const data = snap.val() || {};
    const active = new Set();
    for (const id in data) {
      if (id === myId) continue;
      if (data[id].t > Date.now() - 15000) { active.add(id); upsertRemote(id, data[id]); }
    }
    remotes.forEach((r, id) => { if(!active.has(id)) { scene.remove(r.a.g); remotes.delete(id); } });
    const names = [...remotes.values()].map(r=>r.n).filter(Boolean);
    document.getElementById('who').textContent = '🏛 Музей' + (names.length ? ' · в зале: ' + names.join(', ') : '');
  });

  onValue(ref(db, 'paintings'), (snap) => { applyPaintings(snap.val() || {}); });
  onValue(ref(db, 'time'), (snap) => { const d = snap.val(); if(d) setTime(d.night); });

  setInterval(() => {
    if (!started) return;
    const st = sitting ? 2 : dance > 0 ? 1 : 0;
    const key = [pos.x.toFixed(2), pos.z.toFixed(2), face.toFixed(2), st].join();
    if (key !== lastKey || Date.now() - lastSent > 2000 || isShaking > 0) {
      lastKey = key; lastSent = Date.now();
      const payload = { id: myId, x: +pos.x.toFixed(2), z: +pos.z.toFixed(2), f: +face.toFixed(2), s: st, n: myName, k: myK, t: Date.now() };
      if (isShaking > 0) payload.shake = Date.now() + 2000;
      if (myMsgText && myMsgTime > Date.now() - 7000) { payload.msg = myMsgText; payload.msgT = myMsgTime; }
      set(myRef, payload);
    }
  }, 500);
}

function frame() {
  requestAnimationFrame(frame); const dt=Math.min(clock.getDelta(),.05);
  let fx=0,fz=0;
  if(started&&!lbOpen&&gal.style.display!=='flex'&&isShaking<=0&&modalOverlay.style.display!=='flex'&&document.getElementById('chatModal').style.display!=='flex'){
    if(keys.KeyW||keys.ArrowUp)fz-=1; if(keys.KeyS||keys.ArrowDown)fz+=1;

  const len=Math.hypot(fx,fz); if(len>1){fx/=len;fz/=len}
  if(len>.1){if(sitting)standUp();if(dance>0)dance=0}
  const run=keys.ShiftLeft||keys.ShiftRight||Math.hypot(jv.x,jv.y)>.9,sp=run?4.4:2.4;
  const sy=Math.sin(yaw),cy=Math.cos(yaw);
  const wx=(fx*cy+fz*sy),wz=(-fx*sy+fz*cy);
  const tv=(sitting||dance>0||isShaking>0)?new THREE.Vector3():new THREE.Vector3(wx*sp,0,wz*sp);
  vel.lerp(tv,Math.min(1,dt*10));
  
  const nx=pos.x+vel.x*dt,nz=pos.z+vel.z*dt;if(!blocked(nx,pos.z))pos.x=nx;if(!blocked(pos.x,nz))pos.z=nz;
  
  const speed=vel.length(); walkT+=dt*(speed*2.3);
  if(speed>.15){const target=Math.atan2(vel.x,vel.z);let d=target-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*10)}
  const sw=Math.sin(walkT)*Math.min(1,speed/2.4)*.8;
  let by=Math.abs(Math.sin(walkT))*.025*Math.min(1,speed/2),ry=face;
  armL.rotation.z=armR.rotation.z=0;avatar.rotation.z=0;
  
  if (isShaking > 0) { isShaking -= dt; armL.rotation.x = -1.4; armL.rotation.z = 0; }
  else if(sitting){legL.rotation.x=legR.rotation.x=-1.5;armL.rotation.x=armR.rotation.x=-.5;by=-.27}
  else if(dance>0){dance-=dt;danceT+=dt;const s=danceT*9;legL.rotation.x=Math.sin(s)*.6;legR.rotation.x=-Math.sin(s)*.6;armL.rotation.x=-2.4+Math.sin(s)*.5;armR.rotation.x=-2.4-Math.sin(s)*.5;armL.rotation.z=-.4;armR.rotation.z=.4;by=Math.abs(Math.sin(s))*.1;ry=face+Math.sin(danceT*3)*.7+danceT*1.2;avatar.rotation.z=Math.sin(s)*.06}
  else{legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*.8;armR.rotation.x=sw*.8}
  
  avatar.position.set(pos.x,by,pos.z); avatar.rotation.y=ry; avatar.visible=third;
  
  const eye=new THREE.Vector3(pos.x,sitting?1.25:1.62,pos.z);
  if(third){
    const d=3.2,cp=Math.cos(pitch),tg=new THREE.Vector3(pos.x,sitting?1.1:1.45,pos.z);
    let c=new THREE.Vector3(tg.x+sy*cp*d,tg.y+Math.sin(pitch)*d,tg.z+cy*cp*d);
    c.x=Math.max(-W/2+.3,Math.min(W/2-.3,c.x));c.z=Math.max(-D/2+.3,Math.min(D/2-.3,c.z));c.y=Math.max(.35,Math.min(H-.3,c.y));
    camera.position.lerp(c,Math.min(1,dt*12)); camera.lookAt(tg);
  } else {
    camera.position.copy(eye); camera.rotation.order='YXZ'; camera.rotation.set(-pitch,yaw,0);
  }
  sun.target.position.copy(pos);

  // Рендер камеры наблюдения в ТВ (только когда мы в игре)
  if (started) {
    renderer.setRenderTarget(tvRenderTarget);
    renderer.render(scene, tvCamera);
    renderer.setRenderTarget(null);
  }

  nearFrame=null; nearBench=null; nearRemote=null; 
  let best=3.4; const dir=new THREE.Vector3(-sy,0,-cy);
  
  frames.forEach(f=>{
    const v=f.pos.clone().sub(pos); v.y=0; const d=v.length();
    if(d<best && v.normalize().dot(dir)>.35 && f.n.dot(pos.clone().sub(f.pos).setY(0))>0){best=d;nearFrame=f.group;}
  });
  
  if(!sitting && dance<=0) benches.forEach(b=>{if(Math.abs(pos.x-b[0])<2.1&&Math.abs(pos.z-b[1])<1.35)nearBench=b});
  
  let nearestDist = 2.5;
  remotes.forEach((r, id) => {
    const dx = r.tx - pos.x, dz = r.tz - pos.z;
    const d = Math.hypot(dx, dz);
    if (d < nearestDist) { nearestDist = d; nearRemote = { id: id, n: r.n, r: r }; }
  });

  btnHand.style.display = nearRemote ? 'block' : 'none';
  btnView.style.display = (nearFrame && nearFrame.userData.art) ? 'block' : 'none';
  btnDelete.style.display = (nearFrame && nearFrame.userData.art) ? 'block' : 'none';
  btnAdd.style.display = (nearFrame && !nearFrame.userData.art) ? 'block' : 'none';
  btnSit.style.display = (sitting || nearBench) ? 'block' : 'none';
  btnSit.textContent = sitting ? '🧍 Встать' : '🪑 Присесть';

  if (isTouch) {
    hint.style.display = 'none';
  } else {
    if(nearRemote) { hint.style.display='block'; hintTx.innerHTML = 'Нажмите <b>E</b>, чтобы пожать руку'; }
    else if(nearFrame && !lbOpen) {
      hint.style.display='block';
      if(nearFrame.userData.art) hintTx.innerHTML = '<b>E</b> — смотреть · <b>R</b> — удалить';
      else hintTx.innerHTML = '<b>E</b> — повесить фото';
    } else if(nearBench && !sitting && !lbOpen) { hint.style.display='block'; hintTx.innerHTML = '<b>F</b> — присесть'; }
    else hint.style.display='none';
  }

  if (myMsgSprite && myMsgTime < Date.now() - 7000) {
    avatar.remove(myMsgSprite); myMsgSprite = null; myMsgText = '';
  }

  remotes.forEach(r=>{
    const g=r.a.g,k=Math.min(1,dt*8);
    const ox=g.position.x,oz=g.position.z;
    g.position.x+=(r.tx-ox)*k; g.position.z+=(r.tz-oz)*k;
    r.speed+=(Math.hypot(g.position.x-ox,g.position.z-oz)/Math.max(dt,.001)-r.speed)*.2;
    let d=r.tf-r.face; d=Math.atan2(Math.sin(d),Math.cos(d)); r.face+=d*Math.min(1,dt*10);
    r.t+=dt*r.speed*2.3; const A=r.a; let rby=0;
    A.armL.rotation.z=A.armR.rotation.z=0; g.rotation.z=0;
    
    if (Date.now() < r.shakeUntil) { A.armL.rotation.x = -1.4; A.armL.rotation.z = 0; }
    else if(r.s===2){A.legL.rotation.x=A.legR.rotation.x=-1.5;A.armL.rotation.x=A.armR.rotation.x=-.5;rby=-.27}
    else if(r.s===1){r.dt+=dt;const s=r.dt*9;A.legL.rotation.x=Math.sin(s)*.6;A.legR.rotation.x=-Math.sin(s)*.6;A.armL.rotation.x=-2.4+Math.sin(s)*.5;A.armR.rotation.x=-2.4-Math.sin(s)*.5;A.armL.rotation.z=-.4;A.armR.rotation.z=.4;rby=Math.abs(Math.sin(s))*.1;g.rotation.z=Math.sin(s)*.06}
    else{r.dt=0;const sw2=Math.sin(r.t)*Math.min(1,r.speed/2.4)*.8;A.legL.rotation.x=sw2;A.legR.rotation.x=-sw2;A.armL.rotation.x=-sw2*.8;A.armR.rotation.x=sw2*.8;rby=Math.abs(Math.sin(r.t))*.025*Math.min(1,r.speed/2)}
    
    g.position.y=rby; g.rotation.y=r.face;
  });

  renderer.render(scene,camera);
}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
